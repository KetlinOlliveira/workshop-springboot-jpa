
spring.profiles.active=dev
spring.jpa.open-in-view=true

spring.application.name=curso

# Swagger Config
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# CORS: origem liberada para o front-end consumir a API (separe múltiplas com vírgula).
# "*" (padrão) é conveniente em dev, mas deve virar o domínio real do front em produção.
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:*}