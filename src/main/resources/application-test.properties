spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Sem isso, o Hibernate assume ddl-auto=none para bancos "nao embutidos"
# (ex.: o Postgres real do Testcontainers, que sobrescreve o datasource acima).
spring.jpa.hibernate.ddl-auto=create-drop

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Não é segredo de verdade, só evita que o profile "test" precise de env var.
# Testes de integração com Testcontainers sobrescrevem o datasource acima.
jwt.secret=test-only-secret-nao-use-isso-em-producao-32chars