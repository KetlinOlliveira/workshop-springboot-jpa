services:
  db:
    image: postgres:16
    container_name: moresale-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no seu .env}
      POSTGRES_DB: springboot-course
    ports:
      - "${DB_PORT:-5435}:5432"
    volumes:
      - moresale-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d springboot-course"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  moresale-db-data:
